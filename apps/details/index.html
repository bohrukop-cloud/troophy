<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Discover trending apps on Troophy.">
  <title>App Details — Troophy</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/data/discovery.js"></script>
</head>

<body>

<header class="site-header">
  <div class="container nav">

    <a href="../../index.html" class="brand">
      TROO<span>PHY</span>
    </a>

    <nav class="nav-menu">
      <a href="../../index.html">Home</a>
      <a href="../index.html">Apps</a>
      <a href="../../music/">Troop Board 100</a>
    </nav>

  </div>
</header>

<main class="app-detail-page">

  <div class="container">

    <a class="back-link" href="../index.html">
      ← Back to Apps
    </a>

    <section id="appDetail" class="app-detail">

      <div class="detail-loading">
        Loading discovery...
      </div>

    </section>

  </div>

</main>

<footer>
  <div class="container footer-inner">
    <span>© <span id="year"></span> Troophy</span>
  </div>
</footer>

<script>
const apps = window.TROOPHY_DISCOVERY?.apps || [];

const params = new URLSearchParams(
  window.location.search
);

const requested =
  params.get("app");

const app =
  apps.find(item => item.id === requested) ||
  apps[0];

const target =
  document.getElementById("appDetail");

if (app && target) {

  if (window.TroophyLive) {
    window.TroophyLive.recordView(app);
  }

  if (window.TroophyRecommendations) {
    window.TroophyRecommendations.remember(app);
  }

  if (window.TroophyRecommendations) {
    window.TroophyRecommendations.remember(app);
  }

  document.title =
    `${app.name} — Troophy`;

  target.innerHTML = `

    <div class="detail-icon">
      ${app.name.charAt(0)}
    </div>

    <div class="detail-content">

      <div class="detail-tag">
        ${app.tag}
      </div>

      <h1>
        ${app.name}
      </h1>

      <p class="detail-developer">
        ${app.developer}
      </p>

      <p class="detail-description">
        ${app.description}
      </p>

      <div class="detail-stats">

        <div>
          <strong>★ ${app.rating}</strong>
          <span>Rating</span>
        </div>

        <div>
          <strong>${app.category}</strong>
          <span>Category</span>
        </div>

        <div>
          <strong>Android</strong>
          <span>Platform</span>
        </div>

      </div>

      <a
        class="detail-download"
        href="${app.url}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get on Google Play ↗
      </a>

    </div>
  `;
}

document.getElementById("year").textContent =
  new Date().getFullYear();
</script>

</body>
</html>
